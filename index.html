<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divoom E-learning Demos</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1116; color: #e8eaf0; padding: 24px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #9aa0ad; font-size: .95rem; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #171a21; border: 1px solid #262b36; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: #5b8cff; transform: translateY(-2px); }
  a.card .t { font-weight: 600; font-size: 1.05rem; }
  a.card .d { color: #9aa0ad; font-size: .85rem; margin-top: 4px; }
  a.card .go { color: #5b8cff; font-size: .85rem; margin-top: 8px; display: inline-block; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Divoom E-learning Demos</h1>
    <p class="sub">Chọn một bài để mở.</p>

    <a class="card" href="brand-dna/">
      <div class="t">Brand DNA Tracking</div>
      <div class="d">Divoom E-learning · Brand DNA · v1</div>
      <div class="go">Mở bài →</div>
    </a>

    <a class="card" href="lineup/">
      <div class="t">Lineup Tracking</div>
      <div class="d">Divoom E-learning · Product Lineup · v1</div>
      <div class="go">Mở bài →</div>
    </a>

    <a class="card" href="quiz/">
      <div class="t">Product Visual Quiz</div>
      <div class="d">Divoom · Product Visual Quiz · v2</div>
      <div class="go">Mở bài →</div>
    </a>
  </div>
</body>
</html>
